name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dev dependencies
        run: poetry install --with dev

      - name: Black
        run: poetry run black --check .

      - name: isort
        run: poetry run isort --check .

      - name: Flake8
        run: poetry run flake8 .

      - name: doc8
        run: poetry run doc8 --max-line-length 100 --ignore-path docs/_build docs/

      - name: Docstring formulas
        run: poetry run python scripts/check_docstrings.py

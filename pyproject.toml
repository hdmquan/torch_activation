[tool.poetry]
name = "torch-activation"
version = "1.0.0"
description = "A comprehensive collection of activation functions for PyTorch"
authors = ["Alan Huynh <hdmquan@outlook.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/hdmquan/torch_activation"
repository = "https://github.com/hdmquan/torch_activation"
documentation = "https://torch-activation.readthedocs.io"
keywords = ["pytorch", "activation", "activation-functions", "deep-learning", "neural-networks", "machine-learning"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [{include = "torch_activation"}]

[tool.poetry.dependencies]
python = ">=3.10, <4.0"
torch = ">=1.13.0"

[tool.poetry.extras]
plot = ["plotly", "kaleido"]

[tool.poetry.group.dev.dependencies]
pre-commit = "*"
black = "*"
flake8 = "*"
mypy = "*"
isort = "*"
doc8 = "*"
pytest = "^8.3.5"
loguru = "*"
scipy = "^1.15.2"
plotly = "^6.0.0"
kaleido = "0.2"
sphinx = "8.0"

[tool.doc8]
max-line-length = 100
ignore-path = ["docs/_build", "docs/source/activations"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
